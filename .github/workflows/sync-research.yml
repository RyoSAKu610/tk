name: Sync daily ResearchPhantom feed

on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-feed-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Fetch and validate upstream data
        run: npm run sync:remote
      - name: Verify the complete static build
        run: npm test
      - name: Commit only a validated feed change
        run: |
          if git diff --quiet -- public/data/research-feed.json; then
            echo "No validated feed change."
            exit 0
          fi
          git config user.name "researchphantom-sync[bot]"
          git config user.email "researchphantom-sync[bot]@users.noreply.github.com"
          git add public/data/research-feed.json
          git commit -m "data: sync daily ResearchPhantom feed"
          git push

# Cloudflare Workers Builds watches main. A validated sync commit automatically
# triggers the same production deployment used for application changes.
